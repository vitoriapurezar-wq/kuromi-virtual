
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Kuromi Virtual 💜</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="quarto">
        <header>
            <p class="subtitulo">୨୧ seu cantinho kawaii ୨୧</p>
            <h1>Minha Kuromi 💜</h1>
            <p>Uma amiguinha só sua!</p>
        </header>

        <section class="cartao">
            <div class="status" id="status">♡ Está feliz em te ver!</div>

            <div class="palco" id="palco">
                <span class="decoracao decoracao1">✦</span>
                <span class="decoracao decoracao2">♡</span>

                <button
                    class="kuromi-botao"
                    id="kuromiBotao"
                    aria-label="Fazer carinho na Kuromi"
                >
                    <img
                        src="kuromi.jpg"
                        alt="Minha Kuromi"
                        id="kuromi"
                    >
                </button>
            </div>

            <h2 id="mensagem">Oiii, Mah! Vamos ficar juntinhas? ♡</h2>
            <p class="instrucao">Clique na Kuromi para fazer carinho!</p>

            <div class="carinho">
                <span>Carinho recebido:</span>
                <strong id="contador">0 💗</strong>
            </div>

            <div class="botoes">
                <button id="carinhoBtn">♡ Fazer carinho</button>
                <button id="sonoBtn">☾ Hora de dormir</button>
            </div>
        </section>

        <footer>Feito com amor e um pouquinho de maldade ♡</footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
